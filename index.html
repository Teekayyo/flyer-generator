<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flyer Generator</title>

<link rel="stylesheet" href="style.css">

<script defer src="script.js"></script>

</head>

<body>

<div class="container">

<h1>30th Anniversary Flyer Generator</h1>

<p class="subtitle">
Upload your photo, enter your name and download your personalised flyer.
</p>

<div class="controls">

<label class="upload">

<span>Upload Photo</span>

<input
type="file"
id="photoInput"
accept="image/*">

</label>

<input
id="nameInput"
type="text"
maxlength="45"
placeholder="Enter your full name">

<div class="slider">

<label>

Zoom

</label>

<input
type="range"
id="zoom"
min="0.5"
max="3"
step="0.01"
value="1">

</div>

<div class="buttons">

<button id="resetBtn">

Reset Photo

</button>

<button id="downloadBtn">

Download PNG

</button>

</div>

</div>

<div class="canvasWrapper">

<canvas
id="canvas"
width="1080"
height="1350">

</canvas>

</div>

<div class="tips">

<b>How to use</b>

<ol>

<li>Upload a passport photo.</li>

<li>Drag the photo into position.</li>

<li>Use the zoom slider if necessary.</li>

<li>Type your name.</li>

<li>Download your flyer.</li>

</ol>

</div>

</div>

</body>
</html>
