<h2>30th Anniversary Flyer Generator</h2>

<input
id="nameInput"
type="text"
placeholder="Enter your name">

<br><br>

<input
id="photoInput"
type="file"
accept="image/*">

<br><br>

<label>

Zoom

</label>

<input
id="zoom"
type="range"
min="0.5"
max="3"
step="0.01"
value="1">

<br><br>

<button id="resetBtn">

Reset Photo

</button>

<button id="downloadBtn">

Download PNG

</button>

<br><br>

<canvas
id="canvas"
width="1080"
height="1350">
</canvas>

<script src="script.js"></script>
